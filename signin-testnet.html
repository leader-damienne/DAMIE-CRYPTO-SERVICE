<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
    try {
      localStorage.setItem("dcs_pi_sandbox", "1");
      sessionStorage.setItem("dcs_pi_sandbox", "1");
      window.__dcsPiSandboxForced = true;
    } catch (e) {}
  </script>
  <script src="js/sandbox-boot.js"></script>
  <script src="js/gate.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Connexion Pi — DCS</title>
  <link rel="icon" href="assets/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" /><noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="ticker"><div class="ticker-track" id="ticker-track"></div></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Logo DCS" />
        <div class="brand-text">
          <span class="brand-name" data-brand-name translate="no" lang="en"><span class="g">DAMIE</span> <span class="w">CRYPTO</span> <span class="g">SERVICE</span></span>
          <span class="brand-sub">Connexion Pi</span>
        </div>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="page-hero">
      <h1><span>DAMIE</span> CRYPTO SERVICE</h1>
      <p>Connectez-vous avec Pi pour continuer.</p>
    </div>

    <div class="panel auth-panel">
      <p id="auth-setup-banner" class="auth-error" hidden></p>
      <p id="testnet-ok-banner" hidden style="font-size:0.92rem;color:#9dcca0;margin-bottom:0.85rem;padding:0.75rem 0.85rem;border:1px solid rgba(120,200,140,0.45);border-radius:8px;background:rgba(120,200,140,0.1)">
        <strong>Connexion enregistrée.</strong> Merci — vous pouvez fermer cette page.
      </p>
      <button type="button" class="btn btn-gold" id="pi-login-btn" style="width:100%">Continuer avec Pi</button>
      <p id="signin-error" class="auth-error" hidden style="margin-top:0.85rem"></p>
      <form id="signin-form" autocomplete="on" hidden></form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom" style="border:none;padding-top:0">
      <span>© 2026 Damie Crypto Service (DCS)</span>
    </div>
  </footer>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/backend.js"></script>
  <script src="js/pi.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
