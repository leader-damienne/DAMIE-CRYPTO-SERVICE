[build]
  publish = "."

# Pi Domain Ownership — force-serve key even if static file missing from publish
[[redirects]]
  from = "/validation-key.txt"
  to = "https://raw.githubusercontent.com/leader-damienne/DAMIE-CRYPTO-SERVICE/main/validation-key.txt"
  status = 200
  force = true

[[redirects]]
  from = "/signin"
  to = "/signin.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

# Lien d'invitation PiNet : https://…pinet.com/=pseudo
[[redirects]]
  from = "/=*"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# pi.toml doit être servi en texte brut
[[headers]]
  for = "/.well-known/pi.toml"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"

# Ancienne arborescence imbriquée → site racine
[[redirects]]
  from = "/DamieCryptoService/*"
  to = "/:splat"
  status = 301
