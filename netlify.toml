[build]
  publish = "."

# Pi Domain Ownership — force-serve key even if static file missing from publish
[[redirects]]
  from = "/validation-key.txt"
  to = "https://raw.githubusercontent.com/leader-damienne/DAMIE-CRYPTO-SERVICE/main/validation-key.txt"
  status = 200
  force = true

[[redirects]]
  from = "/signin"
  to = "/signin.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/join"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
